    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* Reset & base */
        *, *:before, *:after { box-sizing: border-box; }
        html, body { margin:0; padding:0; }
        body { background:#fdf3ea; color:#585858; font-family:"Source Sans Pro", Helvetica, sans-serif; font-size:16pt; font-weight:300; line-height:1.75; -webkit-text-size-adjust:none; }
        a { text-decoration:none; color:inherit; border-bottom:none; transition:opacity .2s; }
        img { max-width:100%; display:block; }
        
        /* Preload */
        body.is-preload * { animation:none !important; transition:none !important; }
        
        /* Wrapper */
        #wrapper > * > .inner { width:100%; max-width:68em; margin:0 auto; padding:0 2.5em; }
        @media (max-width:736px){ #wrapper > * > .inner { padding:0 1.25em; } }
        
        :root { --v-gap: 1.4rem; }
        /* Header */
        #header { padding:0; margin:0; }
        #header .inner { padding:var(--v-gap) 0 var(--v-gap) !important; text-align:center; }
        #header img { width:32%; max-width:240px; margin:0 auto; display:block; animation:wobble 3.8s ease-in-out infinite; }
        @keyframes wobble { 0%{transform:rotate(-1deg)} 50%{transform:rotate(1deg)} 100%{transform:rotate(-1deg)} }
        
        /* Main */
        #main { padding-bottom:0 !important; }
        #main > .inner { padding:0 0.5em !important; }
        
        /* Tiles */
        .tiles { margin:0 0 0 -0.4em; display:flex; flex-wrap:wrap; padding:0 0.4em 0; }
        .tiles article { position:relative; margin:0.4em 0 0 0.4em; width:calc(50% - 0.4em); min-height:6.5em; height:6.5em; overflow:hidden; border-radius:4px; }
        .tiles article > .image { position:absolute; inset:0; }
        .tiles article > .image img { width:100%; height:100%; object-fit:cover; }
        .tiles article > .image:before { content:''; position:absolute; inset:0; z-index:1; opacity:0.55; transition:opacity .2s ease; }
        .tiles article > a { position:relative; z-index:3; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; height:100%; padding:1em; text-align:center; color:#fff; }
        .tiles article h2 { font-size:0.9rem; font-weight:600; text-transform:none; letter-spacing:0.2em; margin:0; line-height:1.1; }
        .tiles article .content { display:flex; align-items:center; justify-content:center; margin-top:0.4em; }
        .tiles article .icon { font-size:1.8em; line-height:1; }
        
        /* Colors */
        .tiles article.style1 > .image:before { background:#ff8f0c !important; }
        .tiles article.style2 > .image:before { background:#5170ff !important; }
        .tiles article.style3 > .image:before { background:#f26d34 !important; }
        .tiles article.style4 > .image:before { background:#91b89c !important; }
        .tiles article.style5 > .image:before { background:#fac234 !important; }
        .tiles article.style6 > .image:before { background:#94a7e4 !important; }
        
        .tiles article:hover > .image:before { opacity:0.15 !important; }
        .tiles article { transition: transform 0.22s ease, box-shadow 0.22s ease; }
        .tiles article:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.14); }
        
        .tiles article.style3 h2, .tiles article.style3 .icon { color:#fff !important; }
        
        @media (max-width:600px){
            :root { --v-gap: 0.9rem; }
            .tiles article { width:calc(100% - 0.4em); min-height:5.5em; height:5.5em; }
            #header img { width:45%; }
        }
        
        /* Footer */
        #footer { background:#fdf3ea; padding:var(--v-gap) 0 calc(var(--v-gap) * 0.8); margin:0; }
        #footer ul { margin:0; padding:1em 0; text-align:center; list-style:none; }
        #footer li { font-family:'Amatic SC', cursive; font-weight:700; font-size:1.35rem; color:#5a4a3a; letter-spacing:1.5px; }
        
        /* Modals */
        .modal { display:none; position:fixed; inset:0; z-index:10000; align-items:center; justify-content:center; }
        .modal .close { position:absolute; top:10px; right:18px; font-size:2rem; cursor:pointer; line-height:1; }
        #fs { background:rgba(0,0,0,0.9); }
        #fs .close { color:#fff; }
        #fs img { max-width:92%; max-height:92%; object-fit:contain; }
        #bm, #mm { background:rgba(253,243,234,0.97); }
        #bm .close, #mm .close { color:#5a4a3a; }
    
        .tile-star { position:absolute; top:10px; left:10px; z-index:4; color:#fff; font-size:1.1em; animation:starPulse 2.2s ease-in-out infinite; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.25)); }
        .tile-fs-icon { position:absolute; bottom:10px; right:10px; z-index:4; color:#fff; font-size:1.1em; opacity:0.92; transition: transform 0.2s ease; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.25)); }
        .tiles article:hover .tile-fs-icon { transform: scale(1.1); }
        @keyframes starPulse { 0%,100% { transform:scale(1); opacity:0.9; } 50% { transform:scale(1.18); opacity:1; } }

    </style>

                            <div class="content"><i class="fa-solid fa-envelope"></i></div>
                        </a>
                    </article>

                    <article class="style6">
                        <span class="image"><img src="images/pic11.jpg" alt=""></span>
                        <a href="https://www.facebook.com/share/1Bbd7Xd627/" target="_blank" rel="noopener">
                            <h2>Facebook</h2>
                            <div class="content"><i class="fa-brands fa-facebook-f"></i></div>
                        </a>
                    </article>
                </section>
            </div>
        </div>

        <footer id="footer">
            <div class="inner">
                <ul><li>© Coast Craft Club - 2026</li></ul>
            </div>
        </footer>
    </div>

    <!-- Modals -->
    <div id="fs" class="modal">
        <span class="close">×</span>
        <img id="fsi" src="" alt="">
    </div>

    <div id="bm" class="modal">
        <span class="close">×</span>
        <div style="text-align:center;padding:2rem">
            <img src="images/eblogo.png" alt="" style="width:80px;height:auto;margin:0 auto 0.8rem">
            <p style="font-family:'Amatic SC',cursive;font-weight:700;font-size:1.9rem;color:#f26d34;margin:0;letter-spacing:1.2px">Eventbrite bookings coming soon</p>
        </div>
    </div>

    <div id="mm" class="modal">
        <span class="close">×</span>
        <div style="text-align:center;cursor:pointer;padding:2rem" onclick="copyMail()">
            <i class="fa-solid fa-envelope" style="font-size:2.5rem;color:#fac234;display:block;margin-bottom:0.5rem"></i>
            <p style="font-family:'Amatic SC',cursive;font-weight:700;font-size:2rem;color:#5a4a3a;margin:0;letter-spacing:1.5px">coastcraftclub@outlook.com</p>
            <p id="ct" style="font-family:'Amatic SC',cursive;font-weight:700;font-size:1.2rem;color:#5a4a3a;margin:0.3rem 0 0;opacity:0.8">Tap to copy</p>
        </div>
    </div>

    <script>
        // Remove preload
        window.addEventListener('load', function(){ setTimeout(function(){ document.body.classList.remove('is-preload'); }, 100); });
        
        function copyMail(){
            navigator.clipboard.writeText('coastcraftclub@outlook.com').then(function(){
                var t=document.getElementById('ct'); t.textContent='Copied!'; setTimeout(function(){ t.textContent='Tap to copy'; },1500);
            });
        }
        
        document.querySelectorAll('.open-fs').forEach(function(a){
            a.addEventListener('click', function(e){
                e.preventDefault();
                document.getElementById('fsi').src = a.dataset.img;
                document.getElementById('fs').style.display = 'flex';
            });
        });
        document.querySelectorAll('.open-bm').forEach(function(a){
            a.addEventListener('click', function(e){ e.preventDefault(); document.getElementById('bm').style.display='flex'; });
        });
        document.querySelectorAll('.open-mm').forEach(function(a){
            a.addEventListener('click', function(e){ e.preventDefault(); document.getElementById('mm').style.display='flex'; });
        });
        document.querySelectorAll('.modal').forEach(function(m){
            m.addEventListener('click', function(e){ if(e.target===m) m.style.display='none'; });
            m.querySelector('.close').addEventListener('click', function(){ m.style.display='none'; });
        });
        document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ document.querySelectorAll('.modal').forEach(function(m){ m.style.display='none'; }); }});
    </script>
</body>
</html>
